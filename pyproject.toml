[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "richterpy"
version = "0.1.0"
description = "Richter/InSite waveform parsing and conversion tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
convert = [
  "pandas",
  "obspy",
]
pyrocko = [
  "pyrocko",
  "obspy",
  "pandas",
]
all = [
  "pandas",
  "obspy",
  "pyrocko",
]

[project.scripts]
richter-esf = "richterpy.io.esf:main"
richter-project-metadata = "richterpy.insite.project_metadata:main"
richter-event-waveforms = "richterpy.insite.event_waveforms:main"
richter-stationxml = "richterpy.convert.stations:main"
richter-quakeml = "richterpy.convert.events:main"
richter-esf-quakeml = "richterpy.convert.esf_quakeml:main"
richter-snuffler = "richterpy.convert.snuffler:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["richterpy*"]
